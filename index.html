<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7C4A">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>قائمة الجمعية</title>
<link rel="manifest" href="manifest.webmanifest?v=499693938f">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="قائمة الجمعية">
<link rel="stylesheet" href="app.css?v=41165ffb28">
</head>
<body>
<header class="brand">
  <h1>قائمة الجمعية</h1>
  <p id="subtitle" class="sub">اختر المنتجات وحدد الكمية ثم اضغط «مشاركة قائمة المشتريات»</p>
</header>

<div class="tools" id="tools">
  <label class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.06l4.24 4.24-1.4 1.4-4.24-4.24A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
    <input id="q" type="search" placeholder="ابحث باسم المنتج" autocomplete="off" enterkeyhint="search" aria-label="بحث">
  </label>
  <select id="cat" aria-label="القسم">
    <option value="">كل الأقسام</option>
  </select>
</div>

<main id="catalog" aria-live="polite"></main>
<p id="empty" class="empty" hidden>لا توجد منتجات مطابقة للبحث.</p>
<div class="spacer" aria-hidden="true"></div>

<!-- Bottom action bar (always reachable) -->
<footer class="bar" id="bar">
  <p id="barNote" class="bar-note" hidden></p>
  <div class="bar-row">
    <button id="reviewBtn" class="review-btn" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h2v2H4V6Zm4 0h12v2H8V6Zm-4 5h2v2H4v-2Zm4 0h12v2H8v-2Zm-4 5h2v2H4v-2Zm4 0h12v2H8v-2Z"/></svg>
      <span class="rb-text"><span id="rbCount" class="rb-count">٠</span><span class="rb-label">قائمتي</span></span>
    </button>
    <button id="shareBtn" class="share-btn" type="button" disabled>
      <span class="spin" aria-hidden="true"></span>
      <svg class="sb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.1c-.8 0-1.5.3-2 .8l-7.1-4.2c.1-.2.1-.5.1-.7s0-.5-.1-.7L16 7.2c.5.5 1.2.8 2 .8 1.7 0 3-1.3 3-3s-1.3-3-3-3-3 1.3-3 3c0 .2 0 .5.1.7L8 9.8C7.5 9.3 6.8 9 6 9c-1.7 0-3 1.3-3 3s1.3 3 3 3c.8 0 1.5-.3 2-.8l7.1 4.2c-.1.2-.1.4-.1.6 0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9-1.2-2.9-2.8-2.9Z"/></svg>
      <span id="shareLabel" class="sb-label">مشاركة قائمة المشتريات</span>
    </button>
    <button id="downloadBtn" class="download-btn" type="button" hidden disabled>تنزيل القائمة PDF</button>
  </div>
</footer>

<!-- Review sheet -->
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head">
    <button class="icon-btn" type="button" data-close aria-label="إغلاق">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z"/></svg>
    </button>
    <div class="sheet-title">
      <h2 id="sheetTitle">قائمتي</h2>
      <p id="sheetSummary" class="sheet-summary"></p>
    </div>
    <button id="previewBtn" class="text-btn" type="button">معاينة الملف</button>
  </div>
  <div id="sheetList" class="sheet-list"></div>
  <div id="sheetEmpty" class="sheet-empty" hidden>
    <p>القائمة فارغة.</p>
    <button class="text-btn" type="button" data-close>تصفح المنتجات</button>
  </div>
  <div class="sheet-foot">
    <button id="clearBtn" class="danger-btn" type="button">مسح القائمة</button>
  </div>
</section>

<!-- Photo viewer -->
<section id="viewer" class="viewer" role="dialog" aria-modal="true" aria-labelledby="vName" hidden>
  <div class="viewer-head">
    <button class="icon-btn" type="button" data-close aria-label="إغلاق">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z"/></svg>
    </button>
    <span id="vNo" class="v-no"></span>
  </div>
  <div class="viewer-img" id="vImgBox"><img id="vImg" alt=""></div>
  <div class="viewer-info">
    <h2 id="vName"></h2>
    <div class="viewer-links">
      <button id="vRename" class="text-btn" type="button">تعديل الاسم</button>
      <a id="vOrig" class="text-btn" target="_blank" rel="noopener">لقطة الشاشة الأصلية</a>
    </div>
    <div id="vCtrl" class="viewer-ctrl"></div>
  </div>
</section>

<!-- File preview -->
<section id="preview" class="preview" role="dialog" aria-modal="true" aria-labelledby="pvTitle" hidden>
  <div class="sheet-head">
    <button class="icon-btn" type="button" data-close aria-label="إغلاق">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z"/></svg>
    </button>
    <div class="sheet-title"><h2 id="pvTitle">معاينة ملف PDF</h2><p id="pvInfo" class="sheet-summary"></p></div>
  </div>
  <div id="pvPages" class="pv-pages"></div>
</section>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="catalog.js?v=2b7f8a4cda"></script>
<script src="pdf.js?v=c332f2b2f6"></script>
<script src="app.js?v=346593d4fe"></script>
</body>
</html>
