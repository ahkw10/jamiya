<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7C4A">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>قائمة الجمعية</title>
<link rel="manifest" href="manifest.webmanifest?v=499693938f">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="قائمة الجمعية">
<link rel="stylesheet" href="app.css?v=a75cd4c865">
</head>
<body>
<!-- Home: search, then every section of the store -->
<header class="top" id="top">
  <div class="brand"><b>جمعية</b><span id="topNote">قائمة مشتريات البيت</span></div>
  <label class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.06l4.24 4.24-1.4 1.4-4.24-4.24A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
    <input id="q" type="search" placeholder="ابحثي عن منتج، مثل: نوتيلا ٤٠٠" autocomplete="off" enterkeyhint="search" aria-label="بحث عن منتج">
    <button id="qClear" class="q-clear" type="button" aria-label="مسح البحث" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z"/></svg>
    </button>
  </label>
  <nav id="deptBar" class="dept-bar" aria-label="انتقلي إلى مجموعة أقسام"></nav>
</header>
<main id="home" class="home"></main>
<main id="results" class="results" aria-live="polite" hidden></main>

<!-- The basket, always one tap away -->
<footer class="bar" id="bar">
  <button id="cartBtn" class="cart-btn empty" type="button">
    <span class="cb-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM5.2 4l.4 2H20l-2.3 8.1a2 2 0 0 1-1.9 1.4H8.4a2 2 0 0 1-2-1.6L4.4 4H2V2h4l-.8 2Z"/></svg><b id="cbCount" hidden></b></span>
    <span class="cb-text"><b id="cbTitle">السلة فارغة</b><small id="cbSub">اضغطي + على أي منتج لإضافته</small></span>
    <span class="cb-go" id="cbGo">السلة والإرسال ‹</span>
  </button>
</footer>

<!-- One home section: its kinds as tiles, the home's usual first (a kind opens all its packs as tiles) -->
<section id="pSec" class="page" role="dialog" aria-modal="true" aria-labelledby="secTitle" hidden>
  <div class="page-head">
    <button class="back" type="button" data-close aria-label="رجوع"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 5 15.6 12l-7 7-1.4-1.4 5.6-5.6-5.6-5.6L8.6 5Z"/></svg></button>
    <button class="page-title as-btn" id="secSwitch" type="button" aria-haspopup="dialog">
      <h2 id="secTitle"></h2><p id="secSub" class="sub"></p>
    </button>
    <button class="icon-btn" type="button" data-act="find" aria-label="بحث"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.06l4.24 4.24-1.4 1.4-4.24-4.24A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg></button>
  </div>
  <div id="secBody" class="page-body"></div>
</section>

<!-- Every pack of one kind as tiles, the usual first, with filters when there are many -->
<section id="pType" class="page" role="dialog" aria-modal="true" aria-labelledby="typeTitle" hidden>
  <div class="page-head">
    <button class="back" type="button" data-close aria-label="رجوع"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 5 15.6 12l-7 7-1.4-1.4 5.6-5.6-5.6-5.6L8.6 5Z"/></svg></button>
    <div class="page-title"><h2 id="typeTitle"></h2><p id="typeSub" class="sub"></p></div>
  </div>
  <div id="typeTools" class="tools"></div>
  <div id="typeBody" class="page-body"></div>
</section>

<!-- The basket: what was chosen and how many (stores and prices are only inside the PDF) -->
<section id="pCart" class="page" role="dialog" aria-modal="true" aria-labelledby="cartTitle" hidden>
  <div class="page-head">
    <button class="back" type="button" data-close aria-label="رجوع"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 5 15.6 12l-7 7-1.4-1.4 5.6-5.6-5.6-5.6L8.6 5Z"/></svg></button>
    <div class="page-title"><h2 id="cartTitle">السلة</h2><p id="cartSub" class="sub"></p></div>
    <button id="clearBtn" class="text-btn danger" type="button">مسح الكل</button>
  </div>
  <div id="cartBody" class="page-body"></div>
  <div class="page-foot">
    <p id="sendNote" class="send-note" hidden></p>
    <div class="foot-row">
      <button id="previewBtn" class="btn secondary" type="button">معاينة الملف</button>
      <button id="sendBtn" class="send" type="button" disabled><span class="spin" aria-hidden="true"></span><span id="sendLabel">إرسال القائمة</span></button>
    </div>
  </div>
</section>

<!-- Sections list (switch section from inside a section) -->
<section id="pSections" class="sheet-wrap" role="dialog" aria-modal="true" aria-labelledby="sectionsTitle" hidden>
  <div class="sheet">
    <div class="sheet-head"><h2 id="sectionsTitle">الأقسام</h2><button class="icon-btn" type="button" data-close aria-label="إغلاق"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z"/></svg></button></div>
    <div id="sectionsBody" class="sheet-body"></div>
  </div>
</section>

<!-- One product -->
<section id="pItem" class="sheet-wrap" role="dialog" aria-modal="true" aria-labelledby="itName" hidden>
  <div class="sheet item-sheet">
    <button class="icon-btn sheet-x" type="button" data-close aria-label="إغلاق"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z"/></svg></button>
    <!-- the photo keeps its own box; the name and size start below it, on the sheet's background -->
    <div class="it-img"><img id="itImg" alt=""></div>
    <div class="it-info">
      <p id="itBadge" class="it-badge" hidden>معتاد</p>
      <h2 id="itName"></h2>
      <p id="itSize" class="it-size"></p>
      <div id="itCtrl" class="it-ctrl"></div>
      <button id="itMore" class="link" type="button" hidden></button>
    </div>
  </div>
</section>

<!-- Lists sent before -->
<section id="pHist" class="page" role="dialog" aria-modal="true" aria-labelledby="histTitle" hidden>
  <div class="page-head">
    <button class="back" type="button" data-close aria-label="رجوع"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 5 15.6 12l-7 7-1.4-1.4 5.6-5.6-5.6-5.6L8.6 5Z"/></svg></button>
    <div class="page-title"><h2 id="histTitle">القوائم السابقة</h2><p class="sub">أضيفي قائمة سابقة إلى السلة ثم عدّليها</p></div>
  </div>
  <div id="histBody" class="page-body"></div>
</section>

<!-- The file that will be sent -->
<section id="preview" class="page" role="dialog" aria-modal="true" aria-labelledby="pvTitle" hidden>
  <div class="page-head">
    <button class="back" type="button" data-close aria-label="رجوع"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 5 15.6 12l-7 7-1.4-1.4 5.6-5.6-5.6-5.6L8.6 5Z"/></svg></button>
    <div class="page-title"><h2 id="pvTitle">الملف الذي سيُرسل</h2><p id="pvInfo" class="sub"></p></div>
  </div>
  <div id="pvPages" class="page-body pv-pages"></div>
</section>

<!-- Shopping checklist: opened from the link in the shared list -->
<section id="shop" class="page shop" role="dialog" aria-modal="true" aria-labelledby="shopTitle" hidden>
  <div class="page-head">
    <button class="back" type="button" data-close aria-label="إغلاق"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z"/></svg></button>
    <div class="page-title"><h2 id="shopTitle">قائمة التسوق</h2><p id="shopSub" class="sub"></p></div>
    <button id="shopHide" class="text-btn" type="button">إخفاء ما تم</button>
  </div>
  <div class="shop-progress"><div class="pbar"><span id="shopBar"></span></div><b id="shopCount"></b></div>
  <div id="shopBody" class="page-body"></div>
</section>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="catalog.js?v=bf2d4bde1e"></script>
<script src="pdf.js?v=c5ee5f6533"></script>
<script src="app.js?v=b574f2cf80"></script>
</body>
</html>
